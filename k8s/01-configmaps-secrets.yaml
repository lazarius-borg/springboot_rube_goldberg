apiVersion: v1
kind: ConfigMap
metadata:
  name: rube-goldberg-config
  namespace: rube-goldberg
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/rube-goldberg"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
---
apiVersion: v1
kind: Secret
metadata:
  name: rube-goldberg-secrets
  namespace: rube-goldberg
type: Opaque
stringData:
  POSTGRES_USER: "rube_user"
  POSTGRES_PASSWORD: "rube_password"
