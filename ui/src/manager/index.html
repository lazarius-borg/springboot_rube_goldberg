<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Portal - Spring Boot Rube Goldberg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
        <h2>⚙️ Restaurant Operations & Analytics</h2>
        <span class="badge bg-dark">Manager (Bob)</span>
    </header>

    <div class="row g-4">
        <!-- 1. Real-time Analytics Summary -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between">
                    <span>Live Event-Driven Business Analytics</span>
                    <button class="btn btn-sm btn-outline-light" onclick="loadAnalytics()">Refresh</button>
                </div>
                <div class="card-body">
                    <div class="row text-center" id="analyticsCards">
                        <div class="col-md-3"><div class="p-3 border rounded bg-white"><h3 id="mTotal">0</h3><small class="text-muted">Total Reservations</small></div></div>
                        <div class="col-md-3"><div class="p-3 border rounded bg-white"><h3 id="mCancelled">0</h3><small class="text-muted">Cancellations</small></div></div>
                        <div class="col-md-3"><div class="p-3 border rounded bg-white"><h3 id="mWait">0</h3><small class="text-muted">Waiting List Entries</small></div></div>
                        <div class="col-md-3"><div class="p-3 border rounded bg-white"><h3 id="mConv">0%</h3><small class="text-muted">Conversion Rate</small></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
