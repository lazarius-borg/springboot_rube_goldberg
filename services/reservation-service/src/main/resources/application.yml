server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: reservation-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservation_db}
    username: ${SPRING_DATASOURCE_USERNAME:rube_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rube_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/rube-goldberg}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/rube-goldberg}

security:
  jwt:
    accepted-issuers:
      - ${KEYCLOAK_EXTERNAL_ISSUER_URI:http://localhost:8081/realms/rube-goldberg}
      - ${KEYCLOAK_INTERNAL_ISSUER_URI:http://keycloak:8080/realms/rube-goldberg}
