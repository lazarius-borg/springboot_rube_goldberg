services:
  gateway:
    image: springboot-rube-goldberg/gateway:${IMAGE_TAG:-latest}
    container_name: rube-gateway
    ports:
      - "8080:8080"
      - "5080:5080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - CUSTOMER_SERVICE_URI=http://customer-service:8082
      - RESTAURANT_SERVICE_URI=http://restaurant-service:8083
      - AVAILABILITY_SERVICE_URI=http://availability-service:8084
      - RESERVATION_SERVICE_URI=http://reservation-service:8085
      - WAITING_LIST_SERVICE_URI=http://waiting-list-service:8086
      - ANALYTICS_SERVICE_URI=http://analytics-service:8087
      - NOTIFICATION_SERVICE_URI=http://notification-service:8088
    mem_limit: 512m
    depends_on:
      - redis
      - keycloak

  customer-service:
    image: springboot-rube-goldberg/customer-service:${IMAGE_TAG:-latest}
    container_name: rube-customer-service
    ports:
      - "8082:8082"
      - "5082:5082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5082
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  restaurant-service:
    image: springboot-rube-goldberg/restaurant-service:${IMAGE_TAG:-latest}
    container_name: rube-restaurant-service
    ports:
      - "8083:8083"
      - "5083:5083"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5083
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/restaurant_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
      - SERVICES_RESERVATION_SERVICE_URI=http://reservation-service:8085
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  availability-service:
    image: springboot-rube-goldberg/availability-service:${IMAGE_TAG:-latest}
    container_name: rube-availability-service
    ports:
      - "8084:8084"
      - "5084:5084"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5084
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/availability_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
      - SERVICES_RESTAURANT_SERVICE_URI=http://restaurant-service:8083
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  reservation-service:
    image: springboot-rube-goldberg/reservation-service:${IMAGE_TAG:-latest}
    container_name: rube-reservation-service
    ports:
      - "8085:8085"
      - "5085:5085"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5085
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/reservation_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
      - SERVICES_RESTAURANT_SERVICE_URI=http://restaurant-service:8083
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  waiting-list-service:
    image: springboot-rube-goldberg/waiting-list-service:${IMAGE_TAG:-latest}
    container_name: rube-waiting-list-service
    ports:
      - "8086:8086"
      - "5086:5086"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5086
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8086
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/waiting_list_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
      - SERVICES_RESTAURANT_SERVICE_URI=http://restaurant-service:8083
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    image: springboot-rube-goldberg/notification-service:${IMAGE_TAG:-latest}
    container_name: rube-notification-service
    ports:
      - "8088:8088"
      - "5088:5088"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5088
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8088
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  analytics-service:
    image: springboot-rube-goldberg/analytics-service:${IMAGE_TAG:-latest}
    container_name: rube-analytics-service
    ports:
      - "8087:8087"
      - "5087:5087"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5087
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8087
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/analytics_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
