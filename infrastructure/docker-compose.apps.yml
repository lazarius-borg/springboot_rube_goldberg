services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        JAR_FILE: gateway/target/gateway-1.0.0-SNAPSHOT.jar
    container_name: rube-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - CUSTOMER_SERVICE_URI=http://customer-service:8082
      - RESTAURANT_SERVICE_URI=http://restaurant-service:8083
      - AVAILABILITY_SERVICE_URI=http://availability-service:8084
      - RESERVATION_SERVICE_URI=http://reservation-service:8085
      - WAITING_LIST_SERVICE_URI=http://waiting-list-service:8086
      - ANALYTICS_SERVICE_URI=http://analytics-service:8087
      - NOTIFICATION_SERVICE_URI=http://notification-service:8088
    mem_limit: 512m
    depends_on:
      - redis
      - keycloak

  customer-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        JAR_FILE: services/customer-service/target/customer-service-1.0.0-SNAPSHOT.jar
    container_name: rube-customer-service
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  restaurant-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        JAR_FILE: services/restaurant-service/target/restaurant-service-1.0.0-SNAPSHOT.jar
    container_name: rube-restaurant-service
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/restaurant_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
      - SERVICES_RESERVATION_SERVICE_URI=http://reservation-service:8085
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  availability-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        JAR_FILE: services/availability-service/target/availability-service-1.0.0-SNAPSHOT.jar
    container_name: rube-availability-service
    ports:
      - "8084:8084"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/availability_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
      - SERVICES_RESTAURANT_SERVICE_URI=http://restaurant-service:8083
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  reservation-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
