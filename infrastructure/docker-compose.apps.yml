  notification-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        JAR_FILE: services/notification-service/target/notification-service-1.0.0-SNAPSHOT.jar
    container_name: rube-notification-service
    ports:
      - "8088:8088"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8088
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=rube_user
      - SPRING_DATASOURCE_PASSWORD=rube_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/rube-goldberg
      - SECURITY_JWT_ACCEPTED_ISSUERS=http://localhost:8081/realms/rube-goldberg,http://keycloak:8080/realms/rube-goldberg
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  analytics-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
